<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem - Dra. Fabiana Pierre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- ========================================== -->
    <!-- CÓDIGOS DE RASTREAMENTO (BASE)             -->
    <!-- ========================================== -->

    <!-- Meta Pixel Code (Base) -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    // ATENÇÃO: Descomente a linha abaixo e insira seu Pixel ID depois
    // fbq('init', 'SEU_PIXEL_ID_AQUI'); 
    
    // PageView padrão para todo mundo que acessa a página
    // fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->

    <!-- Google tag (gtag.js) Base -->
    <!-- ATENÇÃO: Substitua SEU_AW_ID_AQUI pelo seu ID do Google Ads (ex: AW-123456789) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=SEU_AW_ID_AQUI"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // ATENÇÃO: Descomente a linha abaixo e insira seu ID
      // gtag('config', 'SEU_AW_ID_AQUI');
    </script>
    <!-- End Google tag -->

    <style>
        :root {
            --bg-color: #F7F6F2;
            --text-color: #2C2C2C;
            --accent-color: #6B705C;
            --border-color: #D1D1D1;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-wrapper {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-family: 'Lora', serif;
            font-weight: 500;
            font-size: 22px;
            margin: 0 0 5px 0;
            color: var(--text-color);
        }

        .header p {
            font-size: 13px;
            color: #7A7A7A;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .step-container {
            position: relative;
            min-height: 250px;
        }

        .step {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .step.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            position: relative;
        }

        label {
            display: block;
            font-family: 'Lora', serif;
            font-size: 24px;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 0;
            font-size: 18px;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            transition: border-color 0.3s ease;
            outline: none;
            resize: none;
        }

        input:focus,
        textarea:focus {
            border-bottom: 1px solid var(--accent-color);
        }

        textarea {
            min-height: 80px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .radio-label:hover {
            border-color: var(--accent-color);
        }

        .radio-label input {
            margin-right: 15px;
            accent-color: var(--accent-color);
        }

        .btn-container {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #555949;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-back {
            background-color: transparent;
            color: #7A7A7A;
            padding: 14px 0;
        }

        .btn-back:hover {
            background-color: transparent;
            color: var(--text-color);
        }

        .progress {
            margin-top: 50px;
            font-size: 12px;
            color: #A0A0A0;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .hidden {
            display: none !important;
        }

    </style>
</head>
<body>

    <div class="form-wrapper">
        <div class="header">
            <h1>Dra. Fabiana Pierre</h1>
            <p>Psiquiatria Humanizada</p>
        </div>

        <div class="step-container" id="form-steps">
            
            <div class="step active" data-step="1">
                <label for="nome">Como gostaria de ser chamada?</label>
                <input type="text" id="nome" placeholder="O seu nome e apelido" autocomplete="name">
                <div class="btn-container">
                    <button class="btn-back hidden">Voltar</button>
                    <button class="btn-next" onclick="nextStep(1)">Avançar</button>
                </div>
            </div>

            <div class="step" data-step="2">
                <label for="whatsapp">Qual é o seu melhor WhatsApp?</label>
                <input type="tel" id="whatsapp" placeholder="(00) 00000-0000" autocomplete="tel">
                <div class="btn-container">
                    <button class="btn-back" onclick="prevStep(2)">Voltar</button>
                    <button class="btn-next" onclick="nextStep(2)">Avançar</button>
                </div>
            </div>

            <div class="step" data-step="3">
                <label for="idade">Qual é a sua idade?</label>
                <input type="number" id="idade" placeholder="A sua idade" min="18" max="100">
                <div class="btn-container">
                    <button class="btn-back" onclick="prevStep(3)">Voltar</button>
                    <button class="btn-next" onclick="nextStep(3)">Avançar</button>
                </div>
            </div>

            <div class="step" data-step="4">
                <label>Como conheceu o trabalho da Dra. Fabiana?</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="origem" value="Indicacao"> Indicação de um conhecido/médico</label>
                    <label class="radio-label"><input type="radio" name="origem" value="Instagram"> Instagram</label>
                    <label class="radio-label"><input type="radio" name="origem" value="Google"> Pesquisa no Google</label>
                    <label class="radio-label"><input type="radio" name="origem" value="Outro"> Outro</label>
                </div>
                <div class="btn-container">
                    <button class="btn-back" onclick="prevStep(4)">Voltar</button>
                    <button class="btn-next" onclick="nextStep(4)">Avançar</button>
                </div>
            </div>

            <div class="step" data-step="5">
                <label for="motivo">Resumidamente, o que motivou a sua procura por acompanhamento psiquiátrico neste momento?</label>
                <textarea id="motivo" placeholder="Escreva de forma breve como se tem sentido..."></textarea>
                <div class="btn-container">
                    <button class="btn-back" onclick="prevStep(5)">Voltar</button>
                    <button class="btn-next" onclick="nextStep(5)">Avançar</button>
                </div>
            </div>

            <div class="step" data-step="6">
                <label>O que procura na consulta de hoje?</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="necessidade" value="Escuta"> Iniciar um acompanhamento com escuta mais aprofundada</label>
                    <label class="radio-label"><input type="radio" name="necessidade" value="Receita"> Apenas a renovação de uma receita médica</label>
                </div>
                <div class="btn-container">
                    <button class="btn-back" onclick="prevStep(6)">Voltar</button>
                    <button class="btn-next" onclick="submitForm()">Finalizar</button>
                </div>
            </div>

            <div class="step" data-step="7" style="text-align: center;">
                <label>Obrigado pelas respostas.</label>
                <p style="font-size: 16px; color: #7A7A7A; line-height: 1.6;">A nossa equipa de acolhimento irá analisar as suas informações e entrará em contacto brevemente pelo WhatsApp.</p>
            </div>

        </div>

        <div class="progress" id="progress-text">Pergunta 1 de 6</div>

    </div>

    <script>
        const totalSteps = 6;
        const sessionId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString();
        
        // URL da sua folha de cálculo gerada (ATUALIZADA)
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbyTeraQMr0sjfVDjhsZu7NlUSxCruHTfD_wC-3LfcrResVDdXbEKP72ju5OhMg2sS151g/exec';

        function updateProgress(currentStep) {
            if (currentStep <= totalSteps) {
                document.getElementById('progress-text').innerText = `Pergunta ${currentStep} de ${totalSteps}`;
                document.getElementById('progress-text').style.display = 'block';
            } else {
                document.getElementById('progress-text').style.display = 'none';
            }
        }

        function nextStep(currentStep) {
            const currentDiv = document.querySelector(`.step[data-step="${currentStep}"]`);
            const nextDiv = document.querySelector(`.step[data-step="${currentStep + 1}"]`);

            if (nextDiv) {
                currentDiv.classList.remove('active');
                nextDiv.classList.add('active');
                updateProgress(currentStep + 1);
                
                // Envia dados parciais em background
                sendDataToSheet(currentStep);
            }
        }

        function prevStep(currentStep) {
            const currentDiv = document.querySelector(`.step[data-step="${currentStep}"]`);
            const prevDiv = document.querySelector(`.step[data-step="${currentStep - 1}"]`);

            if (prevDiv) {
                currentDiv.classList.remove('active');
                prevDiv.classList.add('active');
                updateProgress(currentStep - 1);
            }
        }

        // --- Lógica de Qualificação Replicada no Frontend para o Pixel ---
        function verificarQualificacaoFrontend(idade, necessidade) {
            if (!idade || !necessidade) return "Frio";
            const id = parseInt(idade);
            
            if (id < 18 || necessidade === "Receita") return "Frio";
            if (id >= 30 && id <= 45 && necessidade === "Escuta") return "Quente";
            if (id >= 18 && necessidade === "Escuta") return "Morno";
            
            return "Frio";
        }

        function submitForm() {
            const currentDiv = document.querySelector(`.step[data-step="6"]`);
            const nextDiv = document.querySelector(`.step[data-step="7"]`);
            
            currentDiv.classList.remove('active');
            nextDiv.classList.add('active');
            updateProgress(7);

            // Envia para a Folha de Cálculo a etapa final
            sendDataToSheet(6);

            // Verifica se deve disparar o Pixel/Google Ads
            const idade = document.getElementById('idade').value;
            const necessidadeChecked = document.querySelector('input[name="necessidade"]:checked');
            const necessidade = necessidadeChecked ? necessidadeChecked.value : "";
            
            const qualificacao = verificarQualificacaoFrontend(idade, necessidade);

            if (qualificacao === "Quente" || qualificacao === "Morno") {
                
                // 1. Disparar Evento de Conversão Meta Pixel
                if (typeof fbq === 'function') {
                    fbq('track', 'Lead', {
                        content_category: 'Triagem',
                        content_name: qualificacao // Envia o rótulo "Quente" ou "Morno" para o Facebook
                    });
                    console.log(`[Pixel FB] Lead ${qualificacao} registado com sucesso.`);
                }

                // 2. Disparar Evento de Conversão Google Ads
                if (typeof gtag === 'function') {
                    gtag('event', 'conversion', {
                        // ATENÇÃO: Substitua os IDs abaixo pela sua Action tag real do Ads
                        'send_to': 'SEU_AW_ID_AQUI/SUA_LABEL_DE_CONVERSAO',
                        'event_category': 'Lead',
                        'event_label': qualificacao
                    });
                    console.log(`[Google Ads] Lead ${qualificacao} registado com sucesso.`);
                }
            } else {
                console.log(`Lead qualificado como ${qualificacao} (Frio). Conversão não disparada.`);
            }
        }

        function sendDataToSheet(step) {
            const origemChecked = document.querySelector('input[name="origem"]:checked');
            const necessidadeChecked = document.querySelector('input[name="necessidade"]:checked');

            const payload = {
                sessionId: sessionId,
                step: step,
                nome: document.getElementById('nome').value,
                whatsapp: document.getElementById('whatsapp').value,
                idade: document.getElementById('idade').value,
                origem: origemChecked ? origemChecked.value : "",
                motivo: document.getElementById('motivo').value,
                necessidade: necessidadeChecked ? necessidadeChecked.value : ""
            };

            // Uso de text/plain para não ser bloqueado pelo Google CORS
            fetch(scriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(response => console.log('Sincronizado com sucesso!'))
            .catch(err => console.error('Erro de sincronização:', err));
        }
    </script>

</body>
</html>
