<style>
  :root {
    --bg: #F9FAFB;
    --bg-elev: #FFFFFF;
    --bg-elev-2: #F3F4F6;
    --ink: #0F172A;
    --ink-dim: #334155;
    --ink-muted: #64748B;
    --line: #E5E7EB;
    --line-strong: #D1D5DB;
    --accent: #0F172A; /* Slate 900 */
    --accent-hot: #020617;
    --accent-dim: rgba(15, 23, 42, 0.10);
    --accent-glow: rgba(15, 23, 42, 0.22);
    --navy: #053C73;
    --navy-dark: #032a52;
    --success: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 400;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Efeito de fundo Premium Light */
  body {
    background-image:
      radial-gradient(ellipse 70% 50% at 50% -5%, rgba(15, 23, 42, 0.04), transparent 60%);
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 2;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Header Minimalista */
  header {
    padding: 32px 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-logo {
    height: 28px;
    width: auto;
    display: block;
    /* Filtro para deixar o logo escuro no modo light */
    filter: brightness(0) invert(0.15) sepia(1) hue-rotate(180deg) saturate(300%);
  }

  /* Conteúdo Principal (Vídeo) */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 4vh;
    padding-bottom: 80px;
    text-align: center;
  }

  .kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--success);
    margin-bottom: 24px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(16, 185, 129, 0.1);
    padding: 8px 16px;
    border-radius: 20px;
  }

  .kicker::before {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }

  h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: clamp(20px, 3.5vw, 32px);
    line-height: 1.25;
    letter-spacing: -0.02em;
    color: var(--navy);
    margin-bottom: 40px;
    max-width: 800px;
  }

  .text-accent {
    color: var(--accent);
  }

  /* Container do Vídeo (Vertical/Story 9:16) */
  .video-container {
    width: 100%;
    max-width: 420px; /* Reduzido de volta para simular o formato de telemóvel */
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 32px; /* Bordas mais arredondadas simulando um dispositivo mais moderno */
    padding: 12px;
    box-shadow: 0 25px 50px -12px rgba(5, 60, 115, 0.20), 0 0 0 1px rgba(15, 23, 42, 0.02);
    margin: 0 auto;
  }

  .video-wrapper {
    position: relative;
    aspect-ratio: 9 / 16; /* Retornado para a proporção vertical (Story) */
    width: 100%;
    overflow: hidden;
    border-radius: 20px;
    background: #000;
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Footer Minimalista */
  footer {
    padding: 32px 0;
    text-align: center;
    border-top: 1px solid var(--line);
    position: relative;
    z-index: 2;
  }

  .footer-text {
    font-size: 13px;
    color: var(--ink-muted);
  }

  @media (max-width: 640px) {
    h1 { margin-bottom: 32px; }
    .video-container { padding: 8px; border-radius: 24px; }
    .video-wrapper { border-radius: 16px; }
  }
</style>

<div class="container">

  <header>
    <img src="https://i.imgur.com/Mmk5to4.png" alt="PROClip" class="brand-logo">
  </header>

  <main>
    <div class="kicker">Acesso Liberado</div>
    
    <h1>
      Em 50 minutos, abro o método CLIP® — implantado em mais de 100 clínicas populares — e mostro exatamente o que está travando o crescimento da sua operação e o que fazer nos próximos 7 dias para mudar isso.
    </h1>

    <div class="video-container">
      <div class="video-wrapper">
        <iframe id="panda-bd3cff21-d6dc-4ff9-baa9-cf38b4220e02" src="https://player-vz-ebe391f4-db4.tv.pandavideo.com.br/embed/?v=bd3cff21-d6dc-4ff9-baa9-cf38b4220e02" style="border:none;" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture" allowfullscreen=true width="720" height="360" fetchpriority="high"></iframe>
      </div>
    </div>
  </main>

</div>

<footer>
  <div class="footer-text">
    &copy; PROClip por Clintia. Todos os direitos reservados.
  </div>
</footer>

</body>
